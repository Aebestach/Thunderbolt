Localization
{
    en-us
    {
        #TB_strikeMessage = Heaven pointed at <<1>>!
        #TB_forceStrikeMessage = (Debug) Thunderbolt force-struck <<1>>!
        #TB_strikeDestroyedScreen = <<1>> became a shower of spare parts!
        #TB_divertMessage = Lightning diverted to <<1>>!
        #TB_evaKilledScreen = <<1>> was struck down on EVA!
        #TB_FlightLogStruck = <<1>> received an unscheduled atmospheric performance review.
        #TB_FlightLogDestroyed = <<1>> failed the thunderstorm exam and left the craft prematurely.
        #TB_FlightLogDiverted = <<1>> took the hit so <<2>> did not.
        #TB_FlightLogEvaStruck = <<1>> got a personal lightning greeting while on EVA.
        #TB_FlightLogEvaKilled = <<1>> did not survive the thunderstorm on EVA.

        #TB_ParamSection1 = Thunderbolt (1)
        #TB_ParamSection2 = Thunderbolt (2)
        #TB_ParamTitleStrikeEve = Strike - EVE
        #TB_ParamTitleStrikeNonEve = Strike - NonEVE
        #TB_ParamTitleShared = Shared
        #TB_ParamTitleDamage = Damage
        #TB_ParamTitleVisual = Debug

        #TB_ParamEnableDamage = Enable lightning damage
        #TB_ParamEnableDamage_tip = When enabled, a struck part may be destroyed. When disabled, strikes are visual only.

        #TB_ParamBaseChance = Base strike chance
        #TB_ParamBaseChance_tip = Base probability per check, multiplied by cloud storm strength.

        #TB_ParamNonEveBaseChance = Base strike chance
        #TB_ParamNonEveBaseChance_tip = Base probability per check, multiplied by atmospheric storm strength. Set to 0 to disable random strikes.

        #TB_ParamNonEveStormCellChance = Kerbin storm-cell chance
        #TB_ParamNonEveStormCellChance_tip = Chance a space/time cell is stormy at Kerbin ASL density. Higher = more frequent storms. Other bodies scale by relative ASL density.

        #TB_ParamNonEveDensityPower = Density influence
        #TB_ParamNonEveDensityPower_tip = Exponent for how strongly ASL density vs Kerbin scales storm-cell chance. Higher = denser air strikes more, thinner air less.

        #TB_ParamNonEveStrengthScale = Storm strength scale
        #TB_ParamNonEveStrengthScale_tip = Scales storm strength fed into the strike roll. Higher = a stormy cell is more likely to actually hit.

        #TB_ParamNonEveMaxAltFraction = Max strike altitude fraction
        #TB_ParamNonEveMaxAltFraction_tip = Upper strike band as a fraction of the body's atmosphere depth (then capped by the absolute altitude limit).

        #TB_ParamNonEveMaxAltCap = Max strike altitude cap (m)
        #TB_ParamNonEveMaxAltCap_tip = Absolute altitude ceiling (m) for strikes.

        #TB_ParamNonEveInsideMultiplier = Inside-storm chance multiplier
        #TB_ParamNonEveInsideMultiplier_tip = When the vessel is inside the storm altitude band, multiply strike chance by this value.

        #TB_ParamCheckInterval = Check interval (s)
        #TB_ParamCheckInterval_tip = How often to roll for a lightning strike.

        #TB_ParamVesselCooldown = Vessel cooldown (s)
        #TB_ParamVesselCooldown_tip = Minimum time before the same vessel can be struck again.

        #TB_ParamPartDestroyChance = Normal part destroy chance
        #TB_ParamPartDestroyChance_tip = Chance to destroy a normal part when lightning hits it.

        #TB_ParamVulnerableDestroyChance = Vulnerable part destroy chance
        #TB_ParamVulnerableDestroyChance_tip = Chance to destroy antennas, solar panels, and similar parts.

        #TB_ParamCommandDestroyChance = Command part destroy chance
        #TB_ParamCommandDestroyChance_tip = Chance to destroy command pods and probe cores.

        #TB_ParamEvaKillChance = EVA kill chance
        #TB_ParamEvaKillChance_tip = Chance that a struck EVA kerbal is killed (kept low by default).

        #TB_ParamProtectRoot = Protect root part
        #TB_ParamProtectRoot_tip = Never destroy the vessel root part. Lightning will target other parts instead when available.

        #TB_ParamOnlyActive = Only active vessel
        #TB_ParamOnlyActive_tip = When enabled, only the vessel you are controlling is eligible. When disabled, other nearby loaded vessels may also be struck; unloaded vessels are never considered.

        #TB_ParamInsideCloudMultiplier = Inside-cloud chance multiplier
        #TB_ParamInsideCloudMultiplier_tip = When the vessel is flying inside a lightning-capable storm cloud, multiply strike chance by this value.

        #TB_ParamScreenMessages = Screen messages
        #TB_ParamScreenMessages_tip = Show on-screen messages when lightning strikes.

        #TB_ParamMaxTimeWarp = Max time warp
        #TB_ParamMaxTimeWarp_tip = Do not roll random strikes while physics warp exceeds this rate.

        #TB_ParamMinCoverage = Min cloud coverage
        #TB_ParamMinCoverage_tip = No strikes below this cloud coverage. Higher = denser storms only.

        #TB_ParamMinLightningFrequency = Min lightning frequency
        #TB_ParamMinLightningFrequency_tip = No strikes below this lightning frequency. Higher = stronger storm clouds only.

        #TB_ParamDebugLogging = Debug logging
        #TB_ParamDebugLogging_tip = When enabled, Thunderbolt writes debug messages to the KSP log (candidates, rolls, bridge status, etc.).

        #TB_ParamDebugMode = Debug mode
        #TB_ParamDebugMode_tip = Enable in-flight debug force-strikes with the debug strike key.

        #TB_ParamDebugApplyDamage = Debug apply damage
        #TB_ParamDebugApplyDamage_tip = If enabled, debug force-strikes can destroy parts. If disabled, debug strikes are visual only.

        #TB_ParamDebugStrikeKey = Debug strike key
        #TB_ParamDebugStrikeKey_tip = Hotkey used to force-strike the active vessel while debug mode is on.
    }
}
