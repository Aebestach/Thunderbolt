        #TB_ParamSection1 = 雷劫 (1)
        #TB_ParamSection2 = 雷劫 (2)
        #TB_ParamTitleStrikeEve = 雷击 - EVE
        #TB_ParamTitleStrikeNonEve = 雷击 - NonEVE
        #TB_ParamTitleShared = 共享键
        #TB_ParamTitleDamage = 伤害
        #TB_ParamTitleVisual = 调试

        #TB_ParamEnableDamage = 启用闪电伤害
        #TB_ParamEnableDamage_tip = 开启后，被击中的部件可能被直接摧毁（含调试强制劈）；关闭则所有雷击仅有视觉效果。

        #TB_ParamBaseChance = 基础击中概率
        #TB_ParamBaseChance_tip = 每次检查的基础概率，再乘以云层风暴强度。

        #TB_ParamNonEveBaseChance = 基础击中概率
        #TB_ParamNonEveBaseChance_tip = 每次检查的基础概率，再乘以大气风暴强度。调到 0 即关闭随机雷击。

        #TB_ParamNonEveStormCellChance = Kerbin 风暴格点概率
        #TB_ParamNonEveStormCellChance_tip = 以 Kerbin 海平面密度为基准时，某一时空格点出现雷暴的概率。更高 = 更常打雷。其它星球会再按相对密度缩放。

        #TB_ParamNonEveDensityPower = 密度影响强度
        #TB_ParamNonEveDensityPower_tip = 星球海平面密度相对 Kerbin 时，对风暴格点概率的放大/缩小指数。越大 = 浓大气更狠、稀大气更少。

        #TB_ParamNonEveStrengthScale = 风暴强度系数
        #TB_ParamNonEveStrengthScale_tip = 写入击中掷骰的风暴强度缩放。更高 = 同一格点更容易真正劈中。

        #TB_ParamNonEveMaxAltFraction = 最大雷击高度比例
        #TB_ParamNonEveMaxAltFraction_tip = 相对该星球大气层厚度的雷击带上限比例（再与高度上限取较小值）。

        #TB_ParamNonEveMaxAltCap = 最大雷击高度上限（米）
        #TB_ParamNonEveMaxAltCap_tip = 雷击带绝对高度上限（米）。超过此高度或大气比例上限都不再随机雷击。

        #TB_ParamNonEveInsideMultiplier = 风暴区内击中倍率
        #TB_ParamNonEveInsideMultiplier_tip = 飞船处于风暴核心高度带内时，击中概率乘以该倍率。

        #TB_ParamCheckInterval = 检查间隔（秒）
        #TB_ParamCheckInterval_tip = 每隔多久掷一次是否被闪电击中。

        #TB_ParamVesselCooldown = 同船冷却（秒）
        #TB_ParamVesselCooldown_tip = 同一艘船被击中后，至少间隔这么久才会再次被击中。

        #TB_ParamPartDestroyChance = 普通部件摧毁概率
        #TB_ParamPartDestroyChance_tip = 闪电击中普通部件时将其摧毁的概率。

        #TB_ParamVulnerableDestroyChance = 脆弱部件摧毁概率
        #TB_ParamVulnerableDestroyChance_tip = 天线、太阳能板等脆弱部件被摧毁的概率。

        #TB_ParamCommandDestroyChance = 指令部件摧毁概率
        #TB_ParamCommandDestroyChance_tip = 指令舱 / 探针核心被摧毁的概率。

        #TB_ParamEvaKillChance = EVA 致死概率
        #TB_ParamEvaKillChance_tip = 舱外宇航员被闪电击中时死亡的概率（默认较低）。

        #TB_ParamProtectRoot = 保护根部件
        #TB_ParamProtectRoot_tip = 永不摧毁飞船的根部件；有其他部件时会改劈其他部件。

        #TB_ParamOnlyActive = 仅当前飞船
        #TB_ParamOnlyActive_tip = 开启后只判定你正在操控的飞船。关闭后，附近已加载的其他飞船也可能被击中；未加载的飞船始终不会参与判定。

        #TB_ParamInsideCloudMultiplier = 云内击中倍率
        #TB_ParamInsideCloudMultiplier_tip = 飞船飞进可放电的雷暴云体内时，击中概率乘以该倍率。

        #TB_ParamScreenMessages = 屏幕提示
        #TB_ParamScreenMessages_tip = 被闪电击中时显示屏幕消息。

        #TB_ParamMaxTimeWarp = 最大时间加速
        #TB_ParamMaxTimeWarp_tip = 物理时间加速超过该倍率时不再进行随机雷击判定。

        #TB_ParamMinCoverage = 最低云覆盖
        #TB_ParamMinCoverage_tip = 云覆盖低于此值不雷击。越高 = 只劈更浓的雷暴。

        #TB_ParamMinLightningFrequency = 最低闪电频率
        #TB_ParamMinLightningFrequency_tip = 云类型闪电频率低于此值不雷击。越高 = 只劈更强的雷暴云。

        #TB_ParamDebugLogging = 调试日志
        #TB_ParamDebugLogging_tip = 开启后才会向 KSP 日志输出雷劫的调试信息（候选船、掷骰、桥接状态等）。

        #TB_ParamDebugMode = 调试模式
        #TB_ParamDebugMode_tip = 开启后可在飞行中用调试劈中快捷键强制劈中当前飞船。伤害跟随「启用闪电伤害」。

        #TB_ParamDebugStrikeKey = 调试劈中快捷键
        #TB_ParamDebugStrikeKey_tip = 调试模式下强制劈中当前飞船的按键。
    }
}
