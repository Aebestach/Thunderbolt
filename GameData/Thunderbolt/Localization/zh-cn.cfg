        #TB_divertMessage = 避雷针 <<1>> 把天雷拐跑了！
        #TB_evaKilledScreen = <<1>> 在舱外被天雷点名了……
        #TB_FlightLogStruck = <<1>> 遭雷劫眷顾，焦糊味弥漫座舱。
        #TB_FlightLogDestroyed = <<1>> 未能通过雷劫考核，壮烈解体。
        #TB_FlightLogDiverted = <<1>> 成功引雷，<<2>> 逃过一劫。
        #TB_FlightLogEvaStruck = <<1>> 在舱外挨了一记天雷，头盔里全是静电味。
        #TB_FlightLogEvaKilled = <<1>> 在舱外未能躲过雷劫。

        #TB_ParamSection = 雷劫
        #TB_ParamTitleStrike = 雷击
        #TB_ParamTitleDamage = 伤害
        #TB_ParamTitleVisual = 调试

        #TB_ParamEnableDamage = 启用闪电伤害
        #TB_ParamEnableDamage_tip = 开启后，被击中的部件可能被直接摧毁；关闭则仅有视觉效果。

        #TB_ParamBaseChance = 基础击中概率
        #TB_ParamBaseChance_tip = 每次检查的基础概率，再乘以 EVE 云覆盖与闪电频率。

        #TB_ParamCheckInterval = 检查间隔（秒）
        #TB_ParamCheckInterval_tip = 每隔多久掷一次是否被闪电击中。

        #TB_ParamVesselCooldown = 同船冷却（秒）
        #TB_ParamVesselCooldown_tip = 同一艘船被击中后，至少间隔这么久才会再次被击中。

        #TB_ParamPartDestroyChance = 普通部件摧毁概率
        #TB_ParamPartDestroyChance_tip = 闪电击中普通部件时将其摧毁的概率。

        #TB_ParamVulnerableDestroyChance = 脆弱部件摧毁概率
        #TB_ParamVulnerableDestroyChance_tip = 天线、太阳能板等脆弱部件被摧毁的概率。

        #TB_ParamCommandDestroyChance = 指令部件摧毁概率
        #TB_ParamCommandDestroyChance_tip = 指令舱 / 探针核心被摧毁的概率。

        #TB_ParamEvaKillChance = EVA 致死概率
        #TB_ParamEvaKillChance_tip = 舱外宇航员被闪电击中时死亡的概率（默认较低）。

        #TB_ParamProtectRoot = 保护根部件
        #TB_ParamProtectRoot_tip = 永不摧毁飞船的根部件；有其他部件时会改劈其他部件。

        #TB_ParamOnlyActive = 仅当前飞船
        #TB_ParamOnlyActive_tip = 开启后只判定你正在操控的飞船。关闭后，附近已加载的其他飞船也可能被击中；未加载的飞船始终不会参与判定。

        #TB_ParamInsideCloudMultiplier = 云内击中倍率
        #TB_ParamInsideCloudMultiplier_tip = 当飞船飞进可放电的雷暴云体内时，击中概率乘以该倍率（默认约 10 倍）。

        #TB_ParamScreenMessages = 屏幕提示
        #TB_ParamScreenMessages_tip = 被闪电击中时显示屏幕消息。

        #TB_ParamMaxTimeWarp = 最大时间加速
        #TB_ParamMaxTimeWarp_tip = 物理时间加速超过该倍率时不再进行随机雷击判定。

        #TB_ParamMinCoverage = 最低云覆盖
        #TB_ParamMinCoverage_tip = 飞船上方 EVE 云覆盖低于此值时不会雷击。越高 = 只有更浓的雷暴才会劈。

        #TB_ParamMinLightningFrequency = 最低闪电频率
        #TB_ParamMinLightningFrequency_tip = EVE 云类型闪电频率低于此值时不会雷击。越高 = 只有更强的雷暴云才会劈。

        #TB_ParamDebugLogging = 调试日志
        #TB_ParamDebugLogging_tip = 开启后才会向 KSP 日志输出雷劫的调试信息（候选船、掷骰、桥接状态等）。

        #TB_ParamDebugMode = 调试模式
        #TB_ParamDebugMode_tip = 显示飞行中调试窗口。飞行中也可用 RightAlt+D 开关。

        #TB_ParamDebugApplyDamage = 调试时造成伤害
        #TB_ParamDebugApplyDamage_tip = 开启后，调试强制劈中可摧毁部件；关闭则只看特效。

        #TB_ParamDebugStrikeKey = 调试劈中快捷键
        #TB_ParamDebugStrikeKey_tip = 调试模式下强制劈中当前飞船的按键。
    }
}
